<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="clapperTopClip">
      <rect x="96" y="104" width="320" height="62" rx="16" />
    </clipPath>
  </defs>

  <!-- Fondo Blanco Minimalista con Bordes Redondeados Squircle -->
  <rect width="512" height="512" rx="112" fill="#FFFFFF"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#EAEAEF" stroke-width="3"/>

  <!-- Barra Superior de Claqueta (Negro con Franjas Blancas Anguladas) -->
  <rect x="96" y="104" width="320" height="62" rx="16" fill="#09090B"/>
  <g clip-path="url(#clapperTopClip)">
    <polygon points="132,96 168,96 142,176 106,176" fill="#FFFFFF"/>
    <polygon points="204,96 240,96 214,176 178,176" fill="#FFFFFF"/>
    <polygon points="276,96 312,96 286,176 250,176" fill="#FFFFFF"/>
    <polygon points="348,96 384,96 358,176 322,176" fill="#FFFFFF"/>
  </g>

  <!-- Bisagra / Espaciador entre Barra y Pizarra (Negro) -->
  <circle cx="120" cy="175" r="5" fill="#09090B"/>

  <!-- Pizarra Principal de Video / Claqueta (Negro) -->
  <rect x="96" y="180" width="320" height="228" rx="24" fill="#09090B"/>

  <!-- Símbolo de Reproducción / Play (Blanco Moderno con Vértices Suaves) -->
  <polygon points="236,252 236,322 296,287" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>

  <!-- Línea de Edición de Video / Cabezal de Línea de Tiempo (Playhead Minimalista) -->
  <rect x="176" y="356" width="160" height="6" rx="3" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="256" cy="359" r="6" fill="#FFFFFF"/>
</svg>